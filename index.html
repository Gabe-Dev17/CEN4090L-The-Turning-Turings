<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plateful – Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="auth">
<main class="layout">

  <!-- Left side: brand + plate illustration -->
  <section class="intro" aria-hidden="true">
    <p class="brand">Plateful</p>
    <h1>Know what’s on your plate.</h1>
    <svg class="plate" viewBox="0 0 200 200" role="img">
      <circle cx="100" cy="100" r="98" class="rim"/>
      <path d="M100,100 L100,12 A88,88 0 0,0 100,188 Z" class="veg"/>
      <path d="M100,100 L100,12 A88,88 0 0,1 188,100 Z" class="protein"/>
      <path d="M100,100 L188,100 A88,88 0 0,1 100,188 Z" class="grains"/>
    </svg>
    <p class="caption">Half vegetables, a quarter protein, a quarter grains.</p>
  </section>

  <!-- Right side: forms -->
  <section class="panel">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-login" aria-selected="true" aria-controls="login-form">Log in</button>
      <button class="tab" role="tab" id="tab-register" aria-selected="false" aria-controls="register-form">Create account</button>
    </div>

    <!-- LOGIN -->
    <form id="login-form" class="form" role="tabpanel" aria-labelledby="tab-login" novalidate>
      <h2>Welcome back</h2>

      <label for="login-email">Email</label>
      <input id="login-email" name="email" type="email" autocomplete="email" required>
      <p class="field-error" id="login-email-error"></p>

      <label for="login-password">Password</label>
      <div class="password-wrap">
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        <button type="button" class="show-btn" data-target="login-password">Show</button>
      </div>
      <p class="field-error" id="login-password-error"></p>

      <p class="form-message" id="login-message" role="alert"></p>
      <button type="submit" class="primary">Log in</button>
      <p class="switch">New here? <button type="button" class="link" data-show="register">Create an account</button></p>
    </form>

    <!-- REGISTER -->
    <form id="register-form" class="form" role="tabpanel" aria-labelledby="tab-register" hidden novalidate>
      <h2>Create your account</h2>

      <label for="reg-name">Name</label>
      <input id="reg-name" name="name" type="text" autocomplete="name" required>
      <p class="field-error" id="reg-name-error"></p>

      <label for="reg-email">Email</label>
      <input id="reg-email" name="email" type="email" autocomplete="email" required>
      <p class="field-error" id="reg-email-error"></p>

      <label for="reg-password">Password</label>
      <div class="password-wrap">
        <input id="reg-password" name="password" type="password" autocomplete="new-password" required>
        <button type="button" class="show-btn" data-target="reg-password">Show</button>
      </div>
      <p class="hint">At least 8 characters, with a letter and a number.</p>
      <p class="field-error" id="reg-password-error"></p>

      <label for="reg-confirm">Confirm password</label>
      <input id="reg-confirm" name="confirm" type="password" autocomplete="new-password" required>
      <p class="field-error" id="reg-confirm-error"></p>

      <p class="form-message" id="register-message" role="alert"></p>
      <button type="submit" class="primary">Create account</button>
      <p class="switch">Already have an account? <button type="button" class="link" data-show="login">Log in</button></p>
    </form>
  </section>
</main>

<script src="auth.js"></script>
<script src="app.js"></script>
</body>
</html>
